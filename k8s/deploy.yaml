# Manifest file for k8s

apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-kub-app
  labels:
    app: java-kub-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-kub-app
  template:
    metadata:
      labels:
        app: java-kub-app
    spec:
      containers:
        - name: java-kub
          image: us-central1-docker.pkg.dev/inductive-gift-456306-h4/java-kub/java-kub:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: java-kub-service
spec:
  type: LoadBalancer
  selector:
    app: java-kub-app
  ports:
    - port: 80
      targetPort: 8080
